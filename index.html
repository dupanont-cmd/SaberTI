<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --roxo-escuro: #4C1D95;
    --roxo: #6D28D9;
    --roxo-claro: #8B5CF6;
    --roxo-tint: #F5F1FE;
    --roxo-borda: #DCD1F7;
    --texto: #2E1A47;
    --texto-suave: #6B5C82;
    --erro: #D6335A;
    --branco: #FFFFFF;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--branco);
    font-family: 'Inter', sans-serif;
    color: var(--texto);
    padding: 24px;
  }

  .cartao-login {
    position: relative;
    width: 100%;
    max-width: 380px;
    background: var(--branco);
    border: 1px solid var(--roxo-borda);
    border-radius: 18px;
    padding: 48px 36px 36px;
    box-shadow: 0 20px 45px -20px rgba(109, 40, 217, 0.25);
  }

  .logo {
    position: absolute;
    top: -26px;
    left: 50%;
    transform: translateX(-50%);
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--branco);
    border: 1px solid var(--roxo-borda);
    padding: 6px;
    box-shadow: 0 6px 16px -6px rgba(109, 40, 217, 0.35);
  }

  .logo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 50%;
  }

  h1 {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 1.5rem;
    font-weight: 700;
    text-align: center;
    color: var(--roxo-escuro);
    margin: 12px 0 4px;
  }

  .subtitulo {
    text-align: center;
    font-size: 0.875rem;
    color: var(--texto-suave);
    margin: 0 0 28px;
  }

  .campo {
    margin-bottom: 18px;
  }

  label {
    display: block;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--roxo-escuro);
    margin-bottom: 6px;
    transition: color 0.15s ease;
  }

  input {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--roxo-borda);
    border-radius: 10px;
    font-size: 0.95rem;
    font-family: 'Inter', sans-serif;
    color: var(--texto);
    background: var(--roxo-tint);
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  input:focus {
    border-color: var(--roxo-claro);
    box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.18);
  }

  .campo.erro label {
    color: var(--erro);
  }

  .campo.erro input {
    border-color: var(--erro);
    background: #FDF0F3;
  }

  .mensagem-campo {
    min-height: 16px;
    font-size: 0.75rem;
    color: var(--erro);
    margin-top: 5px;
  }

  .mensagem-geral {
    min-height: 18px;
    font-size: 0.82rem;
    color: var(--erro);
    text-align: center;
    margin: -6px 0 16px;
  }

  .botao-entrar {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: var(--roxo);
    color: var(--branco);
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .botao-entrar:hover {
    background: var(--roxo-escuro);
  }

  .links-auxiliares {
    display: flex;
    justify-content: space-between;
    margin-top: 20px;
  }

  .link-auxiliar {
    background: none;
    border: none;
    padding: 0;
    font-family: 'Inter', sans-serif;
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--roxo);
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .link-auxiliar:hover {
    color: var(--roxo-escuro);
  }
</style>
</head>
<body>

  <form class="cartao-login" id="formLogin" novalidate>
    <div class="logo">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSiz6hjQ62svFZZKuzyxGbxIxeVa0AbIXk6BHW9EP5j-g&s=10" alt="Logo da empresa">
    </div>

    <h1>Entrar na sua conta</h1>
    <p class="subtitulo">Informe seus dados para continuar</p>

    <div class="campo" id="campoUsuario">
      <label for="usuario">Usuário</label>
      <input type="text" id="usuario" name="usuario" autocomplete="username">
      <div class="mensagem-campo" id="erroUsuario"></div>
    </div>

    <div class="campo" id="campoSenha">
      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" autocomplete="current-password">
      <div class="mensagem-campo" id="erroSenha"></div>
    </div>

    <div class="mensagem-geral" id="mensagemGeral"></div>

    <button type="button" class="botao-entrar" id="botaoEntrar">Entrar</button>

    <div class="links-auxiliares">
      <button type="button" class="link-auxiliar" id="botaoCriarConta">Criar conta</button>
      
    </div>
  </form>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="login.js">  
</script>
</body>
</html>
