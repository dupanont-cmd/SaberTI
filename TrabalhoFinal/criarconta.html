<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --roxo-escuro: #4C1D95;
      --roxo: #6D28D9;
      --roxo-claro: #8B5CF6;
      --roxo-tint: #F5F1FE;
      --roxo-borda: #DCD1F7;
      --texto: #2E1A47;
      --texto-suave: #6B5C82;
      --erro: #D6335A;
      --branco: #FFF;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--branco);
      font-family: Inter, sans-serif;
      color: var(--texto);
      padding: 24px;
    }

    .cartao-login {
      position: relative;
      width: 100%;
      max-width: 380px;
      background: var(--branco);
      border: 1px solid var(--roxo-borda);
      border-radius: 18px;
      padding: 48px 36px 36px;
      box-shadow: 0 20px 45px -20px rgba(109, 40, 217, .25);
    }

    .logo {
      position: absolute;
      top: -26px;
      left: 50%;
      transform: translateX(-50%);
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--branco);
      border: 1px solid var(--roxo-borda);
      padding: 6px;
      box-shadow: 0 6px 16px -6px rgba(109, 40, 217, .35);
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
    }

    h1 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      text-align: center;
      color: var(--roxo-escuro);
      margin: 12px 0 4px;
    }

    .subtitulo {
      text-align: center;
      font-size: .875rem;
      color: var(--texto-suave);
      margin: 0 0 28px;
    }

    .campo {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: .8rem;
      font-weight: 600;
      color: var(--roxo-escuro);
      margin-bottom: 6px;
      transition: color .15s ease;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--roxo-borda);
      border-radius: 10px;
      font-size: .95rem;
      font-family: Inter, sans-serif;
      color: var(--texto);
      background: var(--roxo-tint);
      outline: none;
      transition: border-color .15s ease, box-shadow .15s ease;
    }

    input:focus {
      border-color: var(--roxo-claro);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, .18);
    }

    .campo.erro label {
      color: var(--erro);
    }

    .campo.erro input {
      border-color: var(--erro);
      background: #FDF0F3;
    }

    .mensagem-campo {
      min-height: 16px;
      font-size: .75rem;
      color: var(--erro);
      margin-top: 5px;
    }

    .mensagem-geral {
      min-height: 18px;
      font-size: .82rem;
      color: var(--erro);
      text-align: center;
      margin: -6px 0 16px;
    }

    .mensagem-geral.sucesso {
      color: var(--roxo-escuro);
    }

    .botao-entrar {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: var(--roxo);
      color: var(--branco);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s ease;
    }

    .botao-entrar:hover:not(:disabled) {
      background: var(--roxo-escuro);
    }

    .botao-entrar:disabled {
      cursor: wait;
      opacity: .75;
    }

    .links-auxiliares {
      display: flex;
      justify-content: center;
      margin-top: 20px;
    }

    .link-auxiliar {
      background: none;
      border: none;
      padding: 0;
      font-family: Inter, sans-serif;
      font-size: .8rem;
      font-weight: 500;
      color: var(--roxo);
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .link-auxiliar:hover {
      color: var(--roxo-escuro);
    }
  </style>
</head>

<body>
  <form class="cartao-login" id="formCadastro" novalidate>
    <div class="logo"><img
        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSiz6hjQ62svFZZKuzyxGbxIxeVa0AbIXk6BHW9EP5j-g&s=10"
        alt="Logo da empresa"></div>
    <h1>Crie a sua conta</h1>
    <p class="subtitulo">Preencha os dados para começar</p>
    <div class="campo" id="campoEmail"><label for="email">E-mail</label><input type="email" id="email" name="email"
        autocomplete="email" inputmode="email">
      <div class="mensagem-campo" id="erroEmail"></div>
    </div>
    <div class="campo" id="campoSenha"><label for="senha">Senha</label><input type="password" id="senha" name="senha"
        autocomplete="new-password">
      <div class="mensagem-campo" id="erroSenha"></div>
    </div>
    <div class="campo" id="campoConfirmarSenha"><label for="confirmarSenha">Redigite sua senha</label><input
        type="password" id="confirmarSenha" name="confirmarSenha" autocomplete="new-password">
      <div class="mensagem-campo" id="erroConfirmarSenha"></div>
    </div>
    <div class="mensagem-geral" id="mensagemGeral" role="alert"></div>
    <button type="submit" class="botao-entrar" id="botaoCriarConta">Criar minha conta</button>
    <div class="links-auxiliares"><button type="button" class="link-auxiliar" id="botaoVoltar">Voltar para o
        login</button></div>
  </form>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="criarconta.js"></script>
</body>

</html>
