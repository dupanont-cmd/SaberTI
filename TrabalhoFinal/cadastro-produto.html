<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo produto | EMP System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --roxo-escuro: #4C1D95;
            --roxo: #6D28D9;
            --roxo-claro: #8B5CF6;
            --roxo-tint: #F5F1FE;
            --roxo-borda: #DCD1F7;
            --texto: #2E1A47;
            --texto-suave: #6B5C82;
            --branco: #FFF;
            --erro: #D6335A;
            --sucesso: #24835B
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--roxo-tint);
            color: var(--texto);
            font-family: Inter, sans-serif
        }

        .menu-lateral {
            position: fixed;
            display: flex;
            flex-direction: column;
            width: 290px;
            height: 100vh;
            padding: 28px 18px 22px;
            background: #fff;
            border-right: 1px solid var(--roxo-borda)
        }

        .marca {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 10px 28px;
            border-bottom: 1px solid var(--roxo-borda)
        }

        .logo {
            width: 48px;
            height: 48px;
            padding: 5px;
            border: 1px solid var(--roxo-borda);
            border-radius: 50%
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%
        }

        .nome-sistema,
        h1 {
            margin: 0;
            color: var(--roxo-escuro);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700
        }

        .texto-menu {
            margin: 26px 10px 10px;
            color: var(--texto-suave);
            font-size: .72rem;
            font-weight: 600;
            letter-spacing: .07em;
            text-transform: uppercase
        }

        .opcoes-menu {
            display: flex;
            flex-direction: column;
            gap: 7px
        }

        .opcao-menu {
            display: block;
            padding: 13px 14px;
            border-radius: 10px;
            color: var(--texto);
            font-size: .9rem;
            text-decoration: none
        }

        .opcao-menu:hover,
        .opcao-menu.ativa {
            background: var(--roxo-tint);
            color: var(--roxo-escuro)
        }

        .rodape-menu {
            margin-top: auto;
            padding-top: 20px;
            border-top: 1px solid var(--roxo-borda)
        }

        .botao-sair {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--roxo-borda);
            border-radius: 10px;
            background: #fff;
            color: var(--roxo);
            font: 600 .88rem Inter;
            cursor: pointer
        }

        .conteudo {
            margin-left: 290px;
            min-height: 100vh;
            padding: 42px
        }

        .topo {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-bottom: 26px
        }

        h1 {
            margin-bottom: 5px;
            font-size: 1.8rem
        }

        .subtitulo {
            margin: 0;
            color: var(--texto-suave)
        }

        .botao-voltar,
        .botao {
            padding: 11px 15px;
            border: 1px solid var(--roxo-borda);
            border-radius: 10px;
            background: #fff;
            color: var(--roxo);
            font: 600 .88rem Inter;
            cursor: pointer
        }

        .cartao {
            max-width: 720px;
            padding: 30px;
            border: 1px solid var(--roxo-borda);
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 20px 45px -30px rgba(76, 29, 149, .35)
        }

        .campo {
            margin-bottom: 20px
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: var(--roxo-escuro);
            font-size: .84rem;
            font-weight: 600
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid var(--roxo-borda);
            border-radius: 10px;
            outline: none;
            color: var(--texto);
            background: var(--roxo-tint);
            font: inherit
        }

        textarea {
            min-height: 90px;
            resize: vertical
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: var(--roxo-claro);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, .18)
        }

        .botoes {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 28px
        }

        .botao-salvar {
            border-color: var(--roxo);
            background: var(--roxo);
            color: #fff
        }

        .mensagem {
            min-height: 20px;
            margin: 0 0 18px;
            font-size: .84rem
        }

        .erro {
            color: var(--erro)
        }

        .sucesso {
            color: var(--sucesso)
        }

        @media(max-width:650px) {
            .menu-lateral {
                position: static;
                width: 100%;
                height: auto
            }

            .conteudo {
                margin-left: 0;
                padding: 28px 18px
            }

            .topo {
                align-items: flex-start;
                flex-direction: column
            }

            .cartao {
                padding: 22px
            }
        }
    </style>
</head>

<body>
    <aside class="menu-lateral">
        <div class="marca">
            <div class="logo"><img
                    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSiz6hjQ62svFZZKuzyxGbxIxeVa0AbIXk6BHW9EP5j-g&s=10"
                    alt="Logo"></div>
            <p class="nome-sistema">EMP System</p>
        </div>
        <p class="texto-menu">Menu principal</p>
        <nav class="opcoes-menu"><a class="opcao-menu" href="clientes.html">Cadastro de Clientes</a><a
                class="opcao-menu" href="categorias-produto.html">Cadastro de Categorias de Produto</a><a
                class="opcao-menu ativa" href="produtos.html">Cadastro de Produtos</a><a class="opcao-menu"
                href="orcamentos.html">Tela de Orçamentos</a></nav>
        <div class="rodape-menu"><button class="botao-sair" id="botaoSair" type="button">Sign out</button></div>
    </aside>
    <main class="conteudo">
        <div class="topo"><button class="botao-voltar" id="botaoVoltar" type="button">← Voltar</button>
            <div>
                <h1 id="tituloPagina">Novo produto</h1>
                <p class="subtitulo" id="subtituloPagina">Preencha os dados para cadastrar um produto.</p>
            </div>
        </div>
        <!-- Depois de salvar, os campos são limpos para cadastrar o próximo produto. -->
        <form class="cartao" id="formProduto">
            <p class="mensagem" id="mensagemGeral"></p>
            <div class="campo"><label for="nomeProduto">Nome do produto</label><input id="nomeProduto" required
                    autofocus></div>
            <!-- Os campos foram invertidos para a observação aparecer antes da descrição. -->
            <div class="campo"><label for="descricaoProduto">Observação</label><textarea id="descricaoProduto"></textarea></div>
            <div class="campo"><label for="categoriaProduto">Categoria</label><select id="categoriaProduto" required><option value="">Carregando categorias...</option></select></div>
            <div class="campo"><label for="valorProduto">Valor</label><input id="valorProduto" type="number" min="0"
                    step="0.01" required></div>
            <div class="campo"><label for="observacaoProduto">Descrição</label><textarea
                    id="observacaoProduto" required></textarea></div>
            <div class="campo"><label for="statusProduto">Status</label><select id="statusProduto">
                    <option value="Ativo" selected>Ativo</option>
                    <option value="Inativo">Inativo</option>
                </select></div>
            <div class="campo"><label for="dataCadastroProduto">Data de cadastro</label><input id="dataCadastroProduto"
                    type="date" required></div>
            <div class="botoes"><button class="botao" id="botaoLimpar" type="button">Limpar</button><button
                    class="botao botao-salvar" id="botaoSalvar" type="submit">Salvar e cadastrar outro</button></div>
        </form>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="cadastro-produto.js"></script>
</body>

</html>
