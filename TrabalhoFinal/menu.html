<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --roxo-escuro: #4C1D95;
      --roxo: #6D28D9;
      --roxo-claro: #8B5CF6;
      --roxo-tint: #F5F1FE;
      --roxo-borda: #DCD1F7;
      --texto: #2E1A47;
      --texto-suave: #6B5C82;
      --branco: #FFFFFF;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--roxo-tint);
      color: var(--texto);
      font-family: 'Inter', sans-serif;
    }

    .menu-lateral {
      position: fixed;
      top: 0;
      left: 0;
      display: flex;
      flex-direction: column;
      width: 290px;
      height: 100vh;
      padding: 28px 18px 22px;
      background: var(--branco);
      border-right: 1px solid var(--roxo-borda);
      box-shadow: 12px 0 35px -28px rgba(76, 29, 149, 0.45);
    }

    .marca {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 10px 28px;
      border-bottom: 1px solid var(--roxo-borda);
    }

    .logo {
      width: 48px;
      height: 48px;
      padding: 5px;
      flex-shrink: 0;
      border: 1px solid var(--roxo-borda);
      border-radius: 50%;
      background: var(--branco);
      box-shadow: 0 6px 16px -8px rgba(109, 40, 217, 0.45);
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
    }

    .nome-sistema {
      margin: 0;
      color: var(--roxo-escuro);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
    }

    .texto-menu {
      margin: 26px 10px 10px;
      color: var(--texto-suave);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .opcoes-menu {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .opcao-menu {
      display: block;
      width: 100%;
      padding: 13px 14px;
      border-radius: 10px;
      color: var(--texto);
      font-size: 0.9rem;
      font-weight: 500;
      text-decoration: none;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .opcao-menu:hover,
    .opcao-menu:focus {
      outline: none;
      background: var(--roxo-tint);
      color: var(--roxo-escuro);
    }

    .rodape-menu {
      margin-top: auto;
      padding-top: 20px;
      border-top: 1px solid var(--roxo-borda);
    }

    .botao-sair {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--roxo-borda);
      border-radius: 10px;
      background: var(--branco);
      color: var(--roxo);
      font-family: 'Inter', sans-serif;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .botao-sair:hover {
      background: var(--roxo);
      color: var(--branco);
    }

    .conteudo {
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      margin-left: 290px;
      padding: 32px;
      text-align: center;
    }

    .boas-vindas h1 {
      margin: 0 0 8px;
      color: var(--roxo-escuro);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.8rem;
    }

    .boas-vindas p {
      margin: 0;
      color: var(--texto-suave);
    }

    @media (max-width: 650px) {
      .menu-lateral {
        position: static;
        width: 100%;
        height: auto;
        min-height: auto;
      }

      .rodape-menu {
        margin-top: 24px;
      }

      .conteudo {
        min-height: 260px;
        margin-left: 0;
      }
    }
  </style>
</head>

<body>
  <aside class="menu-lateral">
    <div class="marca">
      <div class="logo">
        <img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSiz6hjQ62svFZZKuzyxGbxIxeVa0AbIXk6BHW9EP5j-g&s=10"
          alt="Logo da empresa">
      </div>
      <p class="nome-sistema">EMP System</p>
    </div>

    <p class="texto-menu">Menu principal</p>
    <nav class="opcoes-menu" aria-label="Menu principal">
      <!-- Cada opção aponta para a tela correspondente do sistema. -->
      <a class="opcao-menu" href="clientes.html">Cadastro de Clientes</a>
      <a class="opcao-menu" href="cadastro-categoria-produto.html">Cadastro de Categorias de Produto</a>
      <a class="opcao-menu" href="produtos.html">Cadastro de Produtos</a>
      <a class="opcao-menu" href="orcamentos.html">Tela de Orçamentos</a>
    </nav>

    <div class="rodape-menu">
      <button class="botao-sair" id="botaoSair" type="button">Sign out</button>
    </div>
  </aside>

  <main class="conteudo">
    <section class="boas-vindas">
      <h1>Bem-vindo!</h1>
      <p>Escolha uma opção no menu lateral para continuar.</p>
    </section>
  </main>

  <script src="menu.js"></script>
</body>

</html>
