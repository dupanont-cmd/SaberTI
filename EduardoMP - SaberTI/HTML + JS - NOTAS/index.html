<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>SISTEMA DE SITUAÇÃO DE ALUNO</h1>
    <label for="n1">Nota 1: </label>
    <p><input id="n1" type="number"></p>

    <label for="n2">Nota 2: </label>
    <p><input id="n2" type="number"></p>

    <label for="n3">Nota 3: </label>
    <p><input id="n3" type="number"></p>

    <label for="n4">Nota 4: </label>
    <p><input id="n4" type="number"></p>

    <label for="faltas">Faltas: </label>
    <p><input id="faltas" type="number"></p>

    <button id="botao">VERIFICAR</button>
    <p id="resultado"></p>
    <p id="situacao"></p>
    <script>
        const n1 = document.getElementById("n1");
        const n2 = document.getElementById("n2");
        const n3 = document.getElementById("n3");
        const n4 = document.getElementById("n4");
        const faltas = document.getElementById("faltas");
        let botao = document.getElementById("botao");
        let resultado = document.getElementById("resultado");
        const situacao = document.getElementById("situacao");

        botao.addEventListener("click", function () {
            let media = (Number(n1.value) + Number(n2.value) + Number(n3.value) + Number(n4.value))/ 4;
            resultado.innerText = "MEDIA DO ALUNO: " + media;
            if (media > 5.9 && faltas.value < 21) {
                situacao.innerText = "APROVADO";
            } else {
                if (media > 5.9 && faltas.value > 20) {
                    situacao.innerText= "REPROVADO (NÚMERO DE FALTAS EXCEDIDO)";
                } else {
                    if (media < 6 && faltas.value < 21) {
                        situacao.innerText = "REPROVADO (NOTA ABAIXO DA MÉDIA)";
                    }  else {
                        situacao.innerText = "REPROVADO (NOTA ABAIXO DA MÉDIA E NÚMERO DE FALTAS EXCEDIDO)";
                    }
                }

            }

        });

    </script>
</body>

</html>
