<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <label for="idade">Idade: </label>
    <p><input id="idade" type="number"></p>
    <button id="botao">Verificar</button>
    <p id="resultado"></p>

    <script>
        let idade = document.getElementById("idade");
        let botao = document.getElementById("botao");
        let resultado = document.getElementById("resultado");

        botao.addEventListener("click", function () {
            if (idade.value < 13 && idade.value > -1) {
                resultado.innerText = "Criança.";
            } else {
                if (idade.value > 12 && idade.value < 18) {
                    resultado.innerText = "Adolescente.";
                } else {
                    if (idade.value > 17 && idade.value < 60) {
                        resultado.innerText = "Adulto.";
                    } else {
                        if (idade.value > 59) {
                        resultado.innerText = "Idoso.";
                        } else {
                            resultado.innerText = "Idade Inválida, tente novamente!";
                        }
                    }
                }
            }
        });
    </script>
</body>

</html>
