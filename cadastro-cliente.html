<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novo cliente | EMP System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    /* As variáveis concentram a paleta de cores usada nas outras páginas. */
    :root {
      --roxo-escuro: #4C1D95;
      --roxo: #6D28D9;
      --roxo-claro: #8B5CF6;
      --roxo-tint: #F5F1FE;
      --roxo-borda: #DCD1F7;
      --texto: #2E1A47;
      --texto-suave: #6B5C82;
      --branco: #FFFFFF;
      --erro: #D6335A;
      --sucesso: #24835B;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--roxo-tint);
      color: var(--texto);
      font-family: 'Inter', sans-serif;
    }

    /* Menu lateral: o mesmo conjunto visual existente em clientes.html. */
    .menu-lateral {
      position: fixed;
      top: 0;
      left: 0;
      display: flex;
      flex-direction: column;
      width: 290px;
      height: 100vh;
      padding: 28px 18px 22px;
      background: var(--branco);
      border-right: 1px solid var(--roxo-borda);
      box-shadow: 12px 0 35px -28px rgba(76, 29, 149, .45);
    }

    .marca {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 10px 28px;
      border-bottom: 1px solid var(--roxo-borda);
    }

    .logo {
      width: 48px;
      height: 48px;
      padding: 5px;
      flex-shrink: 0;
      border: 1px solid var(--roxo-borda);
      border-radius: 50%;
      background: var(--branco);
      box-shadow: 0 6px 16px -8px rgba(109, 40, 217, .45);
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
    }

    .nome-sistema {
      margin: 0;
      color: var(--roxo-escuro);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
    }

    .texto-menu {
      margin: 26px 10px 10px;
      color: var(--texto-suave);
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .07em;
      text-transform: uppercase;
    }

    .opcoes-menu {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .opcao-menu {
      display: block;
      width: 100%;
      padding: 13px 14px;
      border-radius: 10px;
      color: var(--texto);
      font-size: .9rem;
      font-weight: 500;
      text-decoration: none;
      transition: background .15s ease, color .15s ease;
    }

    .opcao-menu:hover,
    .opcao-menu:focus,
    .opcao-menu.ativa {
      outline: none;
      background: var(--roxo-tint);
      color: var(--roxo-escuro);
    }

    .rodape-menu {
      margin-top: auto;
      padding-top: 20px;
      border-top: 1px solid var(--roxo-borda);
    }

    .botao-sair {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--roxo-borda);
      border-radius: 10px;
      background: var(--branco);
      color: var(--roxo);
      font-family: 'Inter', sans-serif;
      font-size: .88rem;
      font-weight: 600;
      cursor: pointer;
    }

    .botao-sair:hover {
      background: var(--roxo);
      color: var(--branco);
    }

    /* Área principal: cartão e campos do formulário. */
    .conteudo {
      min-height: 100vh;
      margin-left: 290px;
      padding: 42px;
    }

    .topo {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 26px;
    }

    h1 {
      margin: 0 0 5px;
      color: var(--roxo-escuro);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.8rem;
    }

    .subtitulo {
      margin: 0;
      color: var(--texto-suave);
    }

    .botao-voltar {
      padding: 10px 13px;
      border: 1px solid var(--roxo-borda);
      border-radius: 9px;
      background: var(--branco);
      color: var(--roxo);
      font: 600 .85rem 'Inter', sans-serif;
      cursor: pointer;
    }

    .botao-voltar:hover {
      background: var(--roxo-tint);
    }

    .cartao {
      width: 100%;
      max-width: 720px;
      padding: 30px;
      border: 1px solid var(--roxo-borda);
      border-radius: 16px;
      background: var(--branco);
      box-shadow: 0 20px 45px -30px rgba(76, 29, 149, .35);
    }

    .campo {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: var(--roxo-escuro);
      font-size: .84rem;
      font-weight: 600;
    }

    input,
    select {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--roxo-borda);
      border-radius: 10px;
      outline: none;
      color: var(--texto);
      background: var(--roxo-tint);
      font: inherit;
    }

    input:focus,
    select:focus {
      border-color: var(--roxo-claro);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, .18);
    }

    .dica {
      margin: 6px 0 0;
      color: var(--texto-suave);
      font-size: .76rem;
    }

    .botoes {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 28px;
    }

    .botao {
      padding: 12px 16px;
      border: 1px solid var(--roxo-borda);
      border-radius: 10px;
      background: var(--branco);
      color: var(--roxo);
      font: 600 .88rem 'Inter', sans-serif;
      cursor: pointer;
    }

    .botao:hover {
      background: var(--roxo-tint);
    }

    .botao-salvar {
      border-color: var(--roxo);
      background: var(--roxo);
      color: var(--branco);
    }

    .botao-salvar:hover {
      background: var(--roxo-escuro);
    }

    .mensagem {
      min-height: 20px;
      margin: 0 0 18px;
      font-size: .84rem;
    }

    .mensagem.erro {
      color: var(--erro);
    }

    .mensagem.sucesso {
      color: var(--sucesso);
    }

    @media (max-width:650px) {
      .menu-lateral {
        position: static;
        width: 100%;
        height: auto;
        min-height: auto;
      }

      .rodape-menu {
        margin-top: 24px;
      }

      .conteudo {
        margin-left: 0;
        padding: 28px 18px;
      }

      .topo {
        align-items: flex-start;
        flex-direction: column;
        gap: 12px;
      }

      .cartao {
        padding: 22px;
      }

      .botoes {
        flex-wrap: wrap;
        justify-content: stretch;
      }

      .botao {
        flex: 1;
      }
    }
  </style>
</head>

<body>
  <!-- Menu lateral mantido igual ao da listagem de clientes. -->
  <aside class="menu-lateral">
    <div class="marca">
      <div class="logo"><img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSiz6hjQ62svFZZKuzyxGbxIxeVa0AbIXk6BHW9EP5j-g&s=10"
          alt="Logo da empresa"></div>
      <p class="nome-sistema">EMP System</p>
    </div>
    <p class="texto-menu">Menu principal</p>
    <nav class="opcoes-menu" aria-label="Menu principal"><a class="opcao-menu ativa" href="clientes.html">Cadastro de
        Clientes</a><a class="opcao-menu" href="categorias-produto.html">Cadastro de Categorias de Produto</a><a class="opcao-menu"
        href="produtos.html">Cadastro de Produtos</a><a class="opcao-menu" href="orcamentos.html">Tela de Orçamentos</a></nav>
    <div class="rodape-menu"><button class="botao-sair" id="botaoSair" type="button">Sign out</button></div>
  </aside>

  <!-- Formulário com os dados que serão enviados para a tabela clientes. -->
  <main class="conteudo">
    <div class="topo"><button class="botao-voltar" id="botaoVoltar" type="button">← Voltar</button>
      <div>
        <h1 id="tituloPagina">Novo cliente</h1>
        <!-- Permite adaptar a orientação quando o formulário abre para edição. -->
        <p class="subtitulo" id="subtituloPagina">Preencha os dados abaixo para cadastrar um cliente.</p>
      </div>
    </div>
    <form class="cartao" id="formCliente">
      <p class="mensagem" id="mensagemGeral" aria-live="polite"></p>
      <div class="campo"><label for="tipoPessoa">Tipo de pessoa</label><select id="tipoPessoa" required autofocus>
          <option value="">Selecione</option>
          <option value="F">Pessoa física</option>
          <option value="J">Pessoa jurídica</option>
        </select></div>
      <div class="campo"><label for="nome">Nome completo / Razão social</label><input id="nome" type="text"
          placeholder="Digite o nome" required></div>
      <div class="campo"><label for="cpfCnpj">CPF / CNPJ</label><input id="cpfCnpj" type="text"
          placeholder="Digite o CPF ou CNPJ" maxlength="18" required></div>
      <!-- Mostra um exemplo com DDD e oferece o teclado de telefone em celulares. -->
      <div class="campo"><label for="telefone">Telefone</label><input id="telefone" type="tel"
          placeholder="(11) 99999-9999" required>
        <p class="dica">Pressione Enter em um campo para ir ao próximo.</p>
      </div>
      <div class="botoes"><button class="botao" id="botaoLimpar" type="button">Limpar</button><button
          class="botao botao-salvar" id="botaoSalvar" type="submit">Salvar cliente</button></div>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="cadastro-cliente.js"></script>
</body>
</html>
